<style>
  :root {
    --cor-principal: #1f3a5f;
    --cor-destaque: #c9a227;
    --fundo: #f4f6f9;
    --cartao: #ffffff;
    --texto: #1d2430;
    --texto-suave: #5b6676;
    --borda: #d9dee6;
    --erro: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    line-height: 1.45;
    padding-bottom: 64px;
  }
  .topo { background: var(--cor-principal); color: #fff; padding: 32px 16px; }
  .topo-conteudo, main { max-width: 860px; margin: 0 auto; }
  .logo { color: var(--cor-destaque); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 14px; }
  .topo h1 { margin: 8px 0; font-size: clamp(22px, 4vw, 30px); }
  .topo p { margin: 0; opacity: .9; max-width: 640px; }
  main { padding: 16px; }
  .cartao {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h2 { margin: 0 0 16px; font-size: 19px; display: flex; align-items: center; gap: 10px; }
  .passo {
    display: inline-grid; place-items: center;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--cor-principal); color: #fff; font-size: 14px;
  }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 600; color: var(--texto-suave); }
  .largo { margin-top: 12px; }
  input, select, textarea {
    font: inherit; font-weight: 400; color: var(--texto);
    padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--cor-destaque); outline-offset: 1px; }
  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grade .largo { grid-column: 1 / -1; margin-top: 0; }
  .controles { display: grid; grid-template-columns: 180px 1fr; gap: 12px; }
  .barra-lista { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin: 12px 0 8px; font-size: 13px; color: var(--texto-suave); }
  .lista {
    list-style: none; margin: 0; padding: 0;
    max-height: 420px; overflow-y: auto;
    border: 1px solid var(--borda); border-radius: 8px;
  }
  .lista li + li { border-top: 1px solid var(--borda); }
  .lista label {
    flex-direction: row; align-items: flex-start; gap: 10px;
    padding: 9px 12px; cursor: pointer; font-weight: 400; color: var(--texto);
  }
  .lista label:hover { background: #f7f9fc; }
  .lista input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--cor-principal); }
  .lista .marcado { background: #eef3fa; }
  .vazio { padding: 16px; color: var(--texto-suave); text-align: center; }
  mark { background: #f6e7b0; color: inherit; padding: 0; }
  .link { background: none; border: 0; padding: 0; font: inherit; color: var(--cor-principal); text-decoration: underline; cursor: pointer; }
  .resumo { font-size: 14px; }
  .resumo h3 { font-size: 15px; margin: 12px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: #eef3fa; border: 1px solid #c8d6ea; border-radius: 999px;
    padding: 4px 6px 4px 12px; font-size: 13px;
  }
  .chip button { border: 0; background: none; cursor: pointer; font-size: 16px; line-height: 1; color: var(--texto-suave); padding: 0 4px; }
  .botao {
    margin-top: 16px; width: 100%;
    background: var(--cor-principal); color: #fff; border: 0; border-radius: 8px;
    padding: 14px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .botao:disabled { opacity: .6; cursor: wait; }
  .mensagem { color: var(--erro); font-weight: 600; margin: 12px 0 0; }
  .sucesso { border-color: #9fd3a8; background: #f2fbf3; }
  .armadilha { position: absolute; left: -9999px; width: 1px; height: 1px; }
  .rodape-fixo {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center; gap: 16px; align-items: center;
    padding: 12px 16px; background: #fff; border-top: 1px solid var(--borda);
    font-size: 14px; box-shadow: 0 -2px 8px rgba(0,0,0,.05);
  }
  @media (max-width: 600px) {
    .grade, .controles { grid-template-columns: 1fr; }
    .cartao { padding: 16px; }
  }
</style>
